<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addmission form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <br><br>
    <label for="name">Enter name :</label>
    <input type="text" id="name" name="name" placeholder="enter your name" required>
    <br><br>
<label for="number"> Enter Enrollment Number :</label>
<input type="number" id="number" name="number" placeholder="Enrollment Number" required>
<br><br>
<label for="email">Enter Email Id :</label>
<input type="email" id="email" name="email" placeholder="Email Id" required>
<br><br>
<label for="number">Enter Contact Number :</label>
<input type="number" id="number" name="number" placeholder="Contact Number" required>
<br><br>
<label for="dob">Enter Date of Birth :</label>
<input type="date" id="dob" name="dob" required>
<br><br>
<label for="gender">Select Gender :</label>
<select id="gender" name="gender" required>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
</select>
<br><br>
<label for="course">select course :</label>
<select id="course"name="course" required>
    <option value="cse">CSE</option>
    <option value="it">IT</option>
    <option value="mech">Mechanical</option>
    <option value="civil">Civil</option>
</select>
<br><br>
<button type="submit">Register</button>
</body>
</html>
